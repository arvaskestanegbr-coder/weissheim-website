<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Seite nicht gefunden – WEISSHEIM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Die gewünschte Seite wurde nicht gefunden. Hier geht es zurück zur WEISSHEIM Startseite."
    />

    <script>
      (function () {
        var path = window.location.pathname.toLowerCase();

        // Speziell alte /startseite-URLs abfangen
        if (path === "/startseite" || path === "/startseite/") {
          window.location.replace("/");
          return;
        }
      })();
    </script>

    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #111827;
        background-color: #f9fafb;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrapper {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: clamp(2rem, 4vw, 2.5rem);
        margin-bottom: 0.5rem;
      }
      p {
        color: #6b7280;
        max-width: 30rem;
        margin: 0 auto 1.5rem;
      }
      a.button {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        border: 1px solid #111827;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>Seite nicht gefunden</h1>
      <p>
        Die aufgerufene Adresse existiert nicht mehr. Keine Sorge – du kommst
        mit einem Klick zurück zur WEISSHEIM Startseite.
      </p>
      <a href="/" class="button">Zur Startseite</a>
    </div>
  </body>
</html>
